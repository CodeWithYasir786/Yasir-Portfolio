<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="100%" height="100%">
  <defs>
    <!-- Modern Tech Gradient for Icon -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glowing Accent Line Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0EA5E9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LOGO ICON GROUP (Global/World + Future Tech Connections + Sprout) -->
  <g transform="translate(10, 5)" filter="url(#softShadow)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#techGrad)" />
    
    <!-- Real-World Globe Grid (Subtle background layer) -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <ellipse cx="50" cy="50" rx="16" ry="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="18" y1="50" x2="82" y2="50" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Meaningful Impact: Emerging Leaf Node (Growth & Solution) -->
    <path d="M 50 50 C 50 32 68 28 68 28 C 68 28 68 46 50 50 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M 50 50 C 50 36 36 34 36 34 C 36 34 38 48 50 50 Z" fill="#FFFFFF" fill-opacity="0.6" />

    <!-- Future Tech Connectivity: Circuit Nodes -->
    <!-- Center Stem -->
    <path d="M 50 74 L 50 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Tech Branch & Node -->
    <path d="M 50 62 L 34 54" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="32" cy="53" r="4" fill="#FFFFFF" />

    <!-- Right Tech Branch & Node -->
    <path d="M 50 58 L 66 50" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="68" cy="49" r="4" fill="#FFFFFF" />
    
    <!-- Base Connection Node -->
    <circle cx="50" cy="74" r="5" fill="#FFFFFF" />
  </g>

  <!-- BRAND TITLE: "My Startup" -->
  <g transform="translate(132, 70)">
    <!-- "My" text -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="48" 
          font-weight="400" 
          fill="#64748B" 
          letter-spacing="-0.5">My</text>
    
    <!-- "Startup" text -->
    <text x="72" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="48" 
          font-weight="800" 
          fill="#0F172A" 
          letter-spacing="-0.5">Startup</text>
  </g>
</svg>
